<svg xmlns="http://www.w3.org/2000/svg" class="chart-svg bazi-svg" data-system="bazi" viewBox="0 0 530 500" role="img" aria-label="八字盘"><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif}.chart-svg rect{fill:#101010;stroke:rgba(255,255,255,.25)}.chart-title,.stem,.branch{fill:#f5f5f7}.chart-title{font-size:18px;font-weight:600}.pillar-label,.section-label,.ten-god,.hidden,.meta,.tiny{fill:rgba(245,245,247,.56)}</style><rect width="100%" height="100%" style="fill:#080808;stroke:none"/><style>.bazi-svg .element-metal{fill:#E9C46A}.bazi-svg .element-wood{fill:#66C487}.bazi-svg .element-water{fill:#69A7FF}.bazi-svg .element-fire{fill:#FF6B6B}.bazi-svg .element-earth{fill:#C58A5A}</style><text x="16" y="20" class="chart-title">八字盘</text><g id="bz.pillar.year" class="chart-item pillar"><rect x="20" y="32" width="100" height="208" rx="4"/><text x="70" y="53" text-anchor="middle" class="pillar-label">年柱</text><g id="bz.stem.year" class="chart-item"><text x="70" y="91" text-anchor="middle" class="stem"><tspan class="element-wood">甲</tspan></text><text x="70" y="111" text-anchor="middle" class="ten-god">七杀</text></g><g id="bz.branch.year" class="chart-item"><text x="70" y="151" text-anchor="middle" class="branch"><tspan class="element-earth">戌</tspan></text><text x="70" y="174" text-anchor="middle" class="ten-god">地支</text></g><g id="bz.hidden.year.benqi" class="chart-item hidden"><text x="70" y="194" text-anchor="middle">本：<tspan class="element-earth">戊</tspan></text></g><g id="bz.hidden.year.zhongqi" class="chart-item hidden"><text x="70" y="212" text-anchor="middle">中：<tspan class="element-fire">丁</tspan></text></g><g id="bz.hidden.year.yuqi" class="chart-item hidden"><text x="70" y="230" text-anchor="middle">余：<tspan class="element-metal">辛</tspan></text></g></g><g id="bz.pillar.month" class="chart-item pillar"><rect x="146" y="32" width="100" height="208" rx="4"/><text x="196" y="53" text-anchor="middle"